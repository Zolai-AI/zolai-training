name: Notebook Sanity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  nbconvert-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jupyter nbconvert

      - name: Check notebooks parse as scripts
        run: |
          # Collect tracked .ipynb files from known locations + discovery.
          # The notebooks/ directory is gitignored (experimental), so we
          # search kaggle_notebook_upload/ first, then fall back to find.
          found_notebooks=""
          if compgen -G "kaggle_notebook_upload/*.ipynb" > /dev/null 2>&1; then
            found_notebooks=$(find kaggle_notebook_upload -name '*.ipynb')
          fi
          # Broader discovery for any tracked .ipynb not in node_modules
          extra=$(find . -name '*.ipynb' -not -path '*/node_modules/*' \
                  -not -path './kaggle_notebook_upload/*' 2>/dev/null)
          notebooks=""
          if [ -n "$found_notebooks" ] && [ -n "$extra" ]; then
            notebooks=$(printf '%s\n%s' "$found_notebooks" "$extra")
          elif [ -n "$found_notebooks" ]; then
            notebooks="$found_notebooks"
          elif [ -n "$extra" ]; then
            notebooks="$extra"
          fi

          if [ -z "$notebooks" ]; then
            echo "No .ipynb notebooks found — skipping check."
            exit 0
          fi

          count=$(echo "$notebooks" | wc -l)
          echo "Found $count notebook(s) to check."
          echo "$notebooks"

          failed=0
          for nb in $notebooks; do
            echo "Checking $nb ..."
            if ! jupyter nbconvert --to script --stdout "$nb" > /dev/null 2>&1; then
              # Retry without stderr — if stdout produces output, the notebook
              # structurally parsed fine even though nbconvert warned about
              # kernel metadata or missing extensions (common in headless CI).
              if jupyter nbconvert --to script --stdout "$nb" > /dev/null; then
                echo "  OK (warnings suppressed)"
              else
                echo "  HARD FAIL — notebook JSON may be corrupted"
                failed=$((failed + 1))
              fi
            else
              echo "  OK"
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "$failed notebook(s) failed hard parse"
            exit 1
          fi
          echo "All notebooks OK"
